[project]
name = "agent"
version = "0.0.0"
description = "A Managed Deep Agent project."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents==0.7.4",
    # Context Hub SDK methods (push_agent / pull_agent) need >=0.7.35.
    "langsmith>=0.7.35",
    "httpx>=0.27",
    # Authored tools import `langchain.tools.tool` and middleware imports
    # `langchain.agents.middleware`. The MDA runtime bundles these for the
    # deployment, but they must be direct dependencies to import locally.
    "langchain>=1.0",
]

[dependency-groups]
# Dev-only; not shipped in the deployment build.
dev = ["pytest>=8"]
